name: Control CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Format check
        run: bun run --no-env-file fmt:check
      - name: Metrics smoke test
        run: bun run --no-env-file metrics
